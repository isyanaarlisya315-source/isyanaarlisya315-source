      <circle cx="-13" cy="-12" r="4"/>
      <circle cx="-4" cy="-16" r="4"/>
      <circle cx="5" cy="-16" r="4"/>
      <circle cx="13" cy="-11" r="4"/>
    </g>
    <g class="paw paw-5" transform="translate(370 476)">
      <ellipse cx="0" cy="0" rx="13" ry="10"/>
      <circle cx="-13" cy="-12" r="4"/>
      <circle cx="-4" cy="-16" r="4"/>
      <circle cx="5" cy="-16" r="4"/>
      <circle cx="13" cy="-11" r="4"/>
    </g>
    <g class="paw paw-4" transform="translate(470 460)">
      <ellipse cx="0" cy="0" rx="13" ry="10"/>
      <circle cx="-13" cy="-12" r="4"/>
      <circle cx="-4" cy="-16" r="4"/>
      <circle cx="5" cy="-16" r="4"/>
      <circle cx="13" cy="-11" r="4"/>
    </g>
    <g class="paw paw-3" transform="translate(570 476)">
      <ellipse cx="0" cy="0" rx="13" ry="10"/>
      <circle cx="-13" cy="-12" r="4"/>
      <circle cx="-4" cy="-16" r="4"/>
      <circle cx="5" cy="-16" r="4"/>
      <circle cx="13" cy="-11" r="4"/>
    </g>
    <g class="paw paw-2" transform="translate(670 460)">
      <ellipse cx="0" cy="0" rx="13" ry="10"/>
      <circle cx="-13" cy="-12" r="4"/>
      <circle cx="-4" cy="-16" r="4"/>
      <circle cx="5" cy="-16" r="4"/>
      <circle cx="13" cy="-11" r="4"/>
    </g>
    <g class="paw paw-1" transform="translate(740 476)">
      <ellipse cx="0" cy="0" rx="13" ry="10"/>
      <circle cx="-13" cy="-12" r="4"/>
      <circle cx="-4" cy="-16" r="4"/>
      <circle cx="5" cy="-16" r="4"/>
      <circle cx="13" cy="-11" r="4"/>
    </g>
  </g>
</svg>
