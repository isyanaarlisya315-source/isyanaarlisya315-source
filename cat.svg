<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="A large gentle animated cat with moving paw prints">
  <style>
    .paw {
      opacity: 0;
      animation: paw-walk 7.2s linear infinite;
    }

    .paw-1 { animation-delay: 0s; }
    .paw-2 { animation-delay: 0.6s; }
    .paw-3 { animation-delay: 1.2s; }
    .paw-4 { animation-delay: 1.8s; }
    .paw-5 { animation-delay: 2.4s; }
    .paw-6 { animation-delay: 3s; }
    .paw-7 { animation-delay: 3.6s; }
    .paw-8 { animation-delay: 4.2s; }

    .tail {
      transform-origin: 452px 390px;
      animation: tail-sway 3.8s ease-in-out infinite;
    }

    .ear {
      transform-origin: 300px 172px;
      animation: ear-twitch 5.4s ease-in-out infinite;
    }

    .eyes {
      animation: blink 4.6s ease-in-out infinite;
      transform-origin: center;
    }

    .blush {
      animation: blush 4.6s ease-in-out infinite;
    }

    @keyframes paw-walk {
      0% { opacity: 0; transform: translateX(0); }
      12% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; transform: translateX(46px); }
    }

    @keyframes tail-sway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }

    @keyframes ear-twitch {
      0%, 84%, 100% { transform: rotate(0deg); }
      88% { transform: rotate(-8deg); }
      93% { transform: rotate(4deg); }
    }

    @keyframes blink {
      0%, 88%, 100% { transform: scaleY(1); }
      92% { transform: scaleY(0.08); }
    }

    @keyframes blush {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.85; }
    }
  </style>

  <!-- Paw prints at the top -->
  <g fill="#B7A6D9" opacity="0.85">
    <g class="paw paw-1" transform="translate(70 44)">
      <ellipse cx="0" cy="0" rx="13" ry="10"/>
      <circle cx="-13" cy="-12" r="4"/>
      <circle cx="-4" cy="-16" r="4"/>
      <circle cx="5" cy="-16" r="4"/>
      <circle cx="13" cy="-11" r="4"/>
    </g>
    <g class="paw paw-2" transform="translate(170 58)">
      <ellipse cx="0" cy="0" rx="13" ry="10"/>
      <circle cx="-13" cy="-12" r="4"/>
      <circle cx="-4" cy="-16" r="4"/>
      <circle cx="5" cy="-16" r="4"/>
      <circle cx="13" cy="-11" r="4"/>
    </g>
    <g class="paw paw-3" transform="translate(270 42)">
      <ellipse cx="0" cy="0" rx="13" ry="10"/>
      <circle cx="-13" cy="-12" r="4"/>
      <circle cx="-4" cy="-16" r="4"/>
      <circle cx="5" cy="-16" r="4"/>
      <circle cx="13" cy="-11" r="4"/>
    </g>
    <g class="paw paw-4" transform="translate(370 58)">
      <ellipse cx="0" cy="0" rx="13" ry="10"/>
      <circle cx="-13" cy="-12" r="4"/>
      <circle cx="-4" cy="-16" r="4"/>
      <circle cx="5" cy="-16" r="4"/>
      <circle cx="13" cy="-11" r="4"/>
    </g>
    <g class="paw paw-5" transform="translate(470 42)">
      <ellipse cx="0" cy="0" rx="13" ry="10"/>
      <circle cx="-13" cy="-12" r="4"/>
      <circle cx="-4" cy="-16" r="4"/>
      <circle cx="5" cy="-16" r="4"/>
      <circle cx="13" cy="-11" r="4"/>
    </g>
    <g class="paw paw-6" transform="translate(570 58)">
      <ellipse cx="0" cy="0" rx="13" ry="10"/>
      <circle cx="-13" cy="-12" r="4"/>
      <circle cx="-4" cy="-16" r="4"/>
      <circle cx="5" cy="-16" r="4"/>
      <circle cx="13" cy="-11" r="4"/>
    </g>
    <g class="paw paw-7" transform="translate(670 42)">
      <ellipse cx="0" cy="0" rx="13" ry="10"/>
      <circle cx="-13" cy="-12" r="4"/>
      <circle cx="-4" cy="-16" r="4"/>
      <circle cx="5" cy="-16" r="4"/>
      <circle cx="13" cy="-11" r="4"/>
    </g>
    <g class="paw paw-8" transform="translate(740 58)">
      <ellipse cx="0" cy="0" rx="13" ry="10"/>
      <circle cx="-13" cy="-12" r="4"/>
      <circle cx="-4" cy="-16" r="4"/>
      <circle cx="5" cy="-16" r="4"/>
      <circle cx="13" cy="-11" r="4"/>
    </g>
  </g>

  <!-- Large cat -->
  <g>
    <ellipse cx="400" cy="330" rx="150" ry="120" fill="#FAF6EF" stroke="#2F4858" stroke-width="7"/>

    <path d="M292 218c-10-48 6-82 28-92 18 28 42 46 70 52z" fill="#FAF6EF" stroke="#2F4858" stroke-width="7" stroke-linejoin="round"/>
    <path d="M508 218c10-48-6-82-28-92-18 28-42 46-70 52z" fill="#FAF6EF" stroke="#2F4858" stroke-width="7" stroke-linejoin="round"/>

    <g class="ear">
      <path d="M292 218c-10-48 6-82 28-92 18 28 42 46 70 52z" fill="#FAF6EF" stroke="#2F4858" stroke-width="7" stroke-linejoin="round"/>
    </g>

    <path d="M330 218c-4-22 6-38 18-44 10 16 24 27 40 31z" fill="#E7B75F" opacity="0.75"/>
    <path d="M470 218c4-22-6-38-18-44-10 16-24 27-40 31z" fill="#E7B75F" opacity="0.75"/>

    <g class="eyes">
      <ellipse cx="352" cy="300" rx="17" ry="19" fill="#2F4858"/>
      <ellipse cx="448" cy="300" rx="17" ry="19" fill="#2F4858"/>
      <circle cx="357" cy="294" r="5" fill="#FAF6EF"/>
      <circle cx="453" cy="294" r="5" fill="#FAF6EF"/>
    </g>

    <path d="M386 344h28" stroke="#2F4858" stroke-width="7" stroke-linecap="round"/>
    <path d="M400 344v18m0 0c-8 11-23 11-31 3m31-3c8 11 23 11 31 3" fill="none" stroke="#2F4858" stroke-width="7" stroke-linecap="round"/>

    <ellipse cx="316" cy="338" rx="21" ry="13" fill="#E88C7D" class="blush"/>
    <ellipse cx="484" cy="338" rx="21" ry="13" fill="#E88C7D" class="blush"/>

    <g class="tail">
      <path d="M530 388c72 18 112-10 118-56" fill="none" stroke="#2F4858" stroke-width="22" stroke-linecap="round"/>
    </g>

    <path d="M250 382c-16-28-6-56 18-68" fill="none" stroke="#B7A6D9" stroke-width="7" stroke-linecap="round"/>
    <path d="M550 382c16-28 6-56-18-68" fill="none" stroke="#B7A6D9" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Paw prints at the bottom -->
  <g fill="#E88C7D" opacity="0.8">
    <g class="paw paw-8" transform="translate(70 462)">
      <ellipse cx="0" cy="0" rx="13" ry="10"/>
      <circle cx="-13" cy="-12" r="4"/>
      <circle cx="-4" cy="-16" r="4"/>
      <circle cx="5" cy="-16" r="4"/>
      <circle cx="13" cy="-11" r="4"/>
    </g>
    <g class="paw paw-7" transform="translate(170 476)">
      <ellipse cx="0" cy="0" rx="13" ry="10"/>
      <circle cx="-13" cy="-12" r="4"/>
      <circle cx="-4" cy="-16" r="4"/>
      <circle cx="5" cy="-16" r="4"/>
      <circle cx="13" cy="-11" r="4"/>
    </g>
    <g class="paw paw-6" transform="translate(270 460)">
