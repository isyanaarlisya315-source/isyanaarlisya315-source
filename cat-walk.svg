<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-label="A cute full-body cat with paw prints">
  <!-- Paw prints -->
  <g fill="#B7A6D9" opacity="0.85">
    <g transform="translate(90 70)">
      <ellipse cx="0" cy="0" rx="12" ry="9"/>
      <circle cx="-12" cy="-11" r="4"/>
      <circle cx="-4" cy="-14" r="4"/>
      <circle cx="4" cy="-14" r="4"/>
      <circle cx="12" cy="-10" r="4"/>
    </g>
    <g transform="translate(300 100)">
      <ellipse cx="0" cy="0" rx="12" ry="9"/>
      <circle cx="-12" cy="-11" r="4"/>
      <circle cx="-4" cy="-14" r="4"/>
      <circle cx="4" cy="-14" r="4"/>
      <circle cx="12" cy="-10" r="4"/>
    </g>
    <g transform="translate(80 430)">
      <ellipse cx="0" cy="0" rx="12" ry="9"/>
      <circle cx="-12" cy="-11" r="4"/>
      <circle cx="-4" cy="-14" r="4"/>
      <circle cx="4" cy="-14" r="4"/>
      <circle cx="12" cy="-10" r="4"/>
    </g>
    <g transform="translate(310 450)">
      <ellipse cx="0" cy="0" rx="12" ry="9"/>
      <circle cx="-12" cy="-11" r="4"/>
      <circle cx="-4" cy="-14" r="4"/>
      <circle cx="4" cy="-14" r="4"/>
      <circle cx="12" cy="-10" r="4"/>
    </g>
  </g>

  <!-- Cute full-body cat -->
  <g transform="translate(200 260)">
    <!-- Tail -->
    <path d="M70 120c58 10 82-18 84-52" fill="none" stroke="#2F4858" stroke-width="18" stroke-linecap="round"/>

    <!-- Body -->
    <ellipse cx="0" cy="60" rx="78" ry="90" fill="#FAF6EF" stroke="#2F4858" stroke-width="6"/>

    <!-- Front paws -->
    <ellipse cx="-36" cy="140" rx="22" ry="14" fill="#FAF6EF" stroke="#2F4858" stroke-width="5"/>
    <ellipse cx="36" cy="140" rx="22" ry="14" fill="#FAF6EF" stroke="#2F4858" stroke-width="5"/>

    <!-- Ears -->
    <path d="M-62 -72c-8-32 2-54 20-62 14 22 34 36 56 42z" fill="#FAF6EF" stroke="#2F4858" stroke-width="6" stroke-linejoin="round"/>
    <path d="M62 -72c8-32-2-54-20-62-14 22-34 36-56 42z" fill="#FAF6EF" stroke="#2F4858" stroke-width="6" stroke-linejoin="round"/>

    <!-- Inner ears -->
    <path d="M-46 -70c-4-20 2-34 14-40 10 16 24 26 42 30z" fill="#E7B75F" opacity="0.65"/>
    <path d="M46 -70c4-20-2-34-14-40-10 16-24 26-42 30z" fill="#E7B75F" opacity="0.65"/>

    <!-- Face -->
    <circle cx="-30" cy="-18" r="13" fill="#2F4858"/>
    <circle cx="30" cy="-18" r="13" fill="#2F4858"/>
    <circle cx="-26" cy="-23" r="4" fill="#FAF6EF"/>
    <circle cx="34" cy="-23" r="4" fill="#FAF6EF"/>

    <path d="M-8 14h16" stroke="#2F4858" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 14v12m0 0c-6 9-17 9-23 2m23-2c6 9 17 9 23 2" fill="none" stroke="#2F4858" stroke-width="5" stroke-linecap="round"/>

    <ellipse cx="-48" cy="10" rx="16" ry="10" fill="#E88C7D" opacity="0.7"/>
    <ellipse cx="48" cy="10" rx="16" ry="10" fill="#E88C7D" opacity="0.7"/>

    <!-- Whiskers -->
    <path d="M-70 4h-32M-70 16h-30M70 4h32M70 16h30" stroke="#2F4858" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
