<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-label="A cute full-body cat playing with a paper ball">
  <!-- Paper ball -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="390 350;390 280;390 350" keyTimes="0;0.45;1" dur="1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.3 0 0.7 1;0.3 0 0.7 1"/>
    <circle cx="0" cy="0" r="28" fill="#E7B75F" stroke="#2F4858" stroke-width="5"/>
    <path d="M-18 -10l36 20M-16 12l32-24" stroke="#2F4858" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Cat -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.3 0 0.7 1;0.3 0 0.7 1"/>

    <!-- Tail -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-8 292 352;10 292 352;-8 292 352" dur="1.5s" repeatCount="indefinite"/>
      <path d="M292 352c66 16 102-10 108-56" fill="none" stroke="#2F4858" stroke-width="20" stroke-linecap="round"/>
    </g>

    <!-- Body -->
    <ellipse cx="230" cy="330" rx="92" ry="76" fill="#FAF6EF" stroke="#2F4858" stroke-width="6"/>

    <!-- Back legs -->
    <ellipse cx="176" cy="396" rx="26" ry="16" fill="#FAF6EF" stroke="#2F4858" stroke-width="5"/>
    <ellipse cx="278" cy="396" rx="26" ry="16" fill="#FAF6EF" stroke="#2F4858" stroke-width="5"/>

    <!-- Head -->
    <circle cx="230" cy="205" r="88" fill="#FAF6EF" stroke="#2F4858" stroke-width="6"/>

    <!-- Ears -->
    <path d="M168 148c-6-34 4-56 22-64 14 22 34 36 56 42z" fill="#FAF6EF" stroke="#2F4858" stroke-width="6" stroke-linejoin="round"/>
    <path d="M292 148c6-34-4-56-22-64-14 22-34 36-56 42z" fill="#FAF6EF" stroke="#2F4858" stroke-width="6" stroke-linejoin="round"/>

    <path d="M184 146c-4-22 4-38 16-44 10 16 24 26 42 30z" fill="#E7B75F" opacity="0.65"/>
    <path d="M276 146c4-22-4-38-16-44-10 16-24 26-42 30z" fill="#E7B75F" opacity="0.65"/>

    <!-- Face -->
    <circle cx="198" cy="212" r="13" fill="#2F4858"/>
    <circle cx="262" cy="212" r="13" fill="#2F4858"/>
    <circle cx="202" cy="207" r="4" fill="#FAF6EF"/>
    <circle cx="266" cy="207" r="4" fill="#FAF6EF"/>

    <path d="M220 246h20" stroke="#2F4858" stroke-width="5" stroke-linecap="round"/>
    <path d="M230 246v14m0 0c-7 10-19 10-25 3m25-3c7 10 19 10 25 3" fill="none" stroke="#2F4858" stroke-width="5" stroke-linecap="round"/>

    <ellipse cx="176" cy="240" rx="17" ry="11" fill="#E88C7D" opacity="0.7"/>
    <ellipse cx="284" cy="240" rx="17" ry="11" fill="#E88C7D" opacity="0.7"/>

    <!-- Front paw batting the ball -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 300 320;30 300 320;0 300 320" keyTimes="0;0.45;1" dur="1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.3 0 0.7 1;0.3 0 0.7 1"/>
      <path d="M300 320c30 6 48-6 56-26" fill="none" stroke="#2F4858" stroke-width="18" stroke-linecap="round"/>
      <circle cx="356" cy="292" r="16" fill="#FAF6EF" stroke="#2F4858" stroke-width="5"/>
    </g>
  </g>

  <!-- Little motion marks -->
  <g stroke="#B7A6D9" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <path d="M436 306h22">
      <animate attributeName="opacity" values="0;0.8;0" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M442 340h18">
      <animate attributeName="opacity" values="0;0.8;0" dur="1.5s" begin="0.25s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
